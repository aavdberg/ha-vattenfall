name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff (lint + format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test edge-extension/*.test.js

  pytest:
    name: Pytest (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.9.0", "2026.10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]" "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m pytest -q

  validate:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkout license during repository bootstrap
        id: license
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api licenses/mit --jq .body > "$RUNNER_TEMP/mit-template.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          def normalized(text):
              lines = [line for line in text.splitlines() if not line.startswith("Copyright (c)")]
              return " ".join(" ".join(lines).split())

          template = Path(os.environ["RUNNER_TEMP"], "mit-template.txt").read_text()
          if normalized(Path("LICENSE").read_text()) != normalized(template):
              raise SystemExit("The checkout LICENSE must contain the complete canonical MIT license")
          PY
          license=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.license.spdx_id // ""')
          if [ -z "$license" ]; then
            echo "::notice::Default branch has no detected license yet; verified the checkout's complete MIT text instead."
            echo "ignore=license" >> "$GITHUB_OUTPUT"
          fi
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          ignore: ${{ steps.license.outputs.ignore }}

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    needs: [ruff, pytest, validate, hacs, gitleaks]
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'dev') &&
      needs.ruff.result == 'success' && needs.pytest.result == 'success' &&
      needs.validate.result == 'success' && needs.gitleaks.result == 'success' &&
      (needs.hacs.result == 'success' || needs.hacs.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
